name: Documentation

on:
  push:
    paths:
      - 'docs/README.template.md'
      - 'docs/source/_snippets/**'
      - 'docs/source/**'
      - 'alsgls/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'docs/README.template.md'
      - 'docs/source/_snippets/**'
      - 'docs/source/**'
      - 'alsgls/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install myst-parser
          
      - name: Process README template
        run: |
          python3 .github/scripts/process_readme.py
          
      # On a pull_request, actions/checkout leaves a detached HEAD at the merge
      # commit, so committing and pushing fails outright with "You are not
      # currently on a branch". Verify instead: if the regenerated README
      # differs from the committed one, the template and the file are out of
      # step and that is worth failing the PR for.
      - name: Verify README matches the template
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code README.md || {
            echo "README.md is out of date. Regenerate it with"
            echo "  python3 .github/scripts/process_readme.py"
            echo "and commit the result."
            exit 1
          }

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Auto-update README.md from template"
          git push

  build-docs:
    runs-on: ubuntu-latest
    needs: update-readme
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Install uv
        uses: astral-sh/setup-uv@v7.1.4
        with:
          version: "latest"
        
      - name: Set up Python
        run: uv python install 3.11
        
      - name: Install dependencies
        run: uv sync --extra docs
        
      - name: Build documentation
        run: |
          cd docs
          uv run sphinx-build -b html source _build/html
          
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html